<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial News - TRAKN</title>
<link rel="stylesheet" href="/static/css/styles.css">
<link rel="icon" type="image/png" href="/static/images/favicon.png">
<style>
/* ── NEWS-PAGE ONLY STYLES ── */

/* ── SEARCH BAR ── */
.search-wrap { flex: 1; max-width: 340px; position: relative; min-width: 200px; }
.search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
.search-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: inherit; font-size: 13.5px; padding: 8px 12px 8px 36px; outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
.search-input::placeholder { color: var(--text-faint); }
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }

/* ── CONTENT AREA ── */
.content-area { padding: 24px 32px 48px; flex: 1; width: 100%; }

/* ── CATEGORY TABS ── */
.category-row { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.cat-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.cat-btn:hover { border-color: var(--border2); color: var(--text); }
.cat-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
.cat-btn .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* ── LAYOUT ── */
.news-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start; }

/* ── TRENDING BANNER ── */
.trending-banner { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; overflow: hidden; position: relative; height: 58px; }
.trending-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); background: var(--accent-dim); padding: 4px 8px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; z-index: 2; align-self: center; }
.trending-ticker { overflow: hidden; flex: 1; height: 100%; position: relative; z-index: 1; }
.ticker-inner { display: flex; flex-direction: column; gap: 12px; animation: ticker-vertical 120s linear infinite; padding-top: 0; }
.ticker-item { white-space: nowrap; font-size: 13px; color: var(--text-muted); cursor: default; line-height: 1.4; flex-shrink: 0; }
@keyframes ticker-vertical { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }

/* ── NEWS GRID ── */
.news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

/* ── NEWS CARD ── */
.news-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: all 0.2s; position: relative; }
.news-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
.news-card.bookmarked { border-color: var(--accent); }

/* ── CARD IMAGE ── */
/* To add your own image: replace the <div class="card-image-wrap"> with
   <img class="card-img" src="/static/images/news/YOUR_IMAGE.jpg" alt="article image">
   The .card-img class will handle sizing automatically. */
.card-image-wrap { width: 100%; height: 160px; overflow: hidden; background: var(--surface2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; }
.card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-emoji-placeholder { font-size: 40px; line-height: 1; }
.card-cat-overlay { position: absolute; top: 10px; left: 10px; }

.card-body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
.card-meta { display: flex; align-items: center; justify-content: space-between; }
.card-cat { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 3px 8px; border-radius: 4px; }
.card-date { font-size: 11px; color: var(--text-faint); }

/* Card title: NO click-to-navigate. Cursor is default. */
.card-title { font-size: 14px; font-weight: 600; line-height: 1.4; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: default; }

.card-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
.card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border); margin-top: 4px; }
.card-source { font-size: 11px; color: var(--text-faint); }
.card-actions { display: flex; align-items: center; gap: 8px; }
.btn-icon { width: 28px; height: 28px; border-radius: var(--radius-xs); border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-size: 14px; }
.btn-icon:hover { border-color: var(--border2); color: var(--text); }
.btn-icon.bookmarked { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
/* Read button: this is the ONLY way to open an article link */
.btn-read { font-size: 11.5px; font-weight: 500; color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: var(--radius-xs); border: 1px solid rgba(245,166,35,0.3); transition: all 0.15s; cursor: pointer; }
.btn-read:hover { background: var(--accent-dim); }

/* ── CATEGORY COLOR CLASSES ── */
/* Stock Market */
.cat-sm { background: var(--blue-dim);   color: var(--blue); }
/* Crypto */
.cat-cr { background: var(--purple-dim); color: var(--purple); }
/* Economy */
.cat-ec { background: var(--red-dim);    color: var(--red); }
/* Corporate */
.cat-co { background: rgba(245,166,35,0.12); color: var(--accent); }
/* Banking */
.cat-bk { background: var(--green-dim);  color: var(--green); }
/* Commodity */
.cat-cm { background: rgba(180,120,60,0.12); color: #b47a3c; }
/* Forex */
.cat-fx { background: rgba(90,180,200,0.12); color: #3aabb5; }
/* Personal Finance */
.cat-pf { background: var(--green-dim);  color: var(--green); }
/* Real Estate */
.cat-re { background: rgba(160,100,200,0.12); color: #a064c8; }
/* Global */
.cat-gl { background: var(--blue-dim);   color: var(--blue); }

/* ── RIGHT COLUMN ── */
.right-col { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 88px; }
.section-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.section-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.section-title { font-size: 13px; font-weight: 600; }
.section-badge { font-size: 10px; background: var(--accent-dim); color: var(--accent); padding: 2px 8px; border-radius: 10px; font-weight: 600; }
.bookmark-item { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 10px; cursor: pointer; transition: background 0.15s; }
.bookmark-item:last-child { border-bottom: none; }
.bookmark-item:hover { background: var(--surface2); }
.bm-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.bm-title { font-size: 12.5px; font-weight: 500; line-height: 1.4; color: var(--text); }
.empty-bm { padding: 24px 18px; text-align: center; color: var(--text-muted); font-size: 12.5px; }

/* ── TOAST ── */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 18px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); z-index: 999; display: flex; align-items: center; gap: 8px; transform: translateY(80px); opacity: 0; transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1); pointer-events: none; }
.toast.show { transform: none; opacity: 1; }
.toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

/* ── RESPONSIVE ── */
@media (max-width: 1100px) { .news-layout { grid-template-columns: 1fr; } .right-col { position: static; margin-top: 20px; } }
@media (max-width: 768px) { .content-area { padding: 16px; } .search-wrap { max-width: 100%; order: 3; flex-basis: 100%; } }
.menu-toggle { display: none; cursor: pointer; padding: 5px; }
@media (max-width: 768px) { .menu-toggle { display: block; } }
</style>

// ─────────────────────────────────────────────
// HELPER: date builder
// ─────────────────────────────────────────────
function daysAgo(days, hoursOffset) {
  var d = new Date();
  d.setDate(d.getDate() - days);
  if (hoursOffset) d.setHours(d.getHours() - hoursOffset);
  return d.toISOString();
}

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
const $ = id => document.getElementById(id);
let bookmarks = JSON.parse(localStorage.getItem('trakn-bookmarks') || '[]');
let currentCat = 'all', currentSearch = '';

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
function init() {
  updateClock();
  setInterval(updateClock, 1000);
  renderAll();
  renderBookmarkPanel();
  buildTicker();
  setupEventListeners();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function updateClock() {
  var now = new Date();
  var opts = { weekday:'long', day:'numeric', month:'long', year:'numeric' };
  var time = now.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  $('liveTime').textContent = now.toLocaleDateString('en-IN', opts) + ' • ' + time;
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function renderAll() {
  var q = currentSearch.toLowerCase();
  var filtered = NEWS.filter(function(a) {
    var matchCat = currentCat === 'all' || a.category === currentCat;
    var matchSearch = !q || a.title.toLowerCase().includes(q) || a.description.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
  $('newsGrid').innerHTML = '';
  filtered.forEach(function(a) { $('newsGrid').appendChild(makeCard(a)); });
}

function makeCard(a) {
  var cat = CATS[a.category] || { label:'Finance', cls:'cat-pf', emoji:'📰' };
  var isBm = bookmarks.some(function(b) { return b.id === a.id; });
  var div = document.createElement('div');
  div.className = 'news-card' + (isBm ? ' bookmarked' : '');

  // IMAGE: if imgSrc is set, show <img>; otherwise show emoji placeholder
  var imageHTML = '';
  if (a.imgSrc) {
    imageHTML = '<div class="card-image-wrap"><img class="card-img" src="' + a.imgSrc + '" alt="' + a.title + '" onerror="this.parentNode.innerHTML=\'<span class=card-emoji-placeholder>' + a.emoji + '</span>\'"><div class="card-cat-overlay"><span class="card-cat ' + cat.cls + '">' + cat.label + '</span></div></div>';
  } else {
    imageHTML = '<div class="card-image-wrap"><span class="card-emoji-placeholder">' + (a.emoji || cat.emoji) + '</span><div class="card-cat-overlay"><span class="card-cat ' + cat.cls + '">' + cat.label + '</span></div></div>';
  }

  div.innerHTML = imageHTML +
    '<div class="card-body">' +
      '<div class="card-meta">' +
        '<span class="card-date">' + timeAgo(a.date) + '</span>' +
      '</div>' +
      // Title has NO onclick — cursor: default prevents accidental clicks
      '<div class="card-title">' + a.title + '</div>' +
      '<div class="card-desc">' + a.description + '</div>' +
      '<div class="card-footer">' +
        '<div class="card-source">' + a.source + '</div>' +
        '<div class="card-actions">' +
          '<button class="btn-icon ' + (isBm ? 'bookmarked' : '') + '" title="' + (isBm ? 'Remove bookmark' : 'Bookmark') + '" onclick="toggleBookmark(' + a.id + ', this)">' + (isBm ? '🔖' : '🏷️') + '</button>' +
          // READ is the ONLY way to open the article URL
          '<a class="btn-read" href="' + a.url + '" target="_blank" rel="noopener">Read ↗</a>' +
        '</div>' +
      '</div>' +
    '</div>';
  return div;
}

// ─────────────────────────────────────────────
// BOOKMARKS
// ─────────────────────────────────────────────
function toggleBookmark(id, btn) {
  var art = NEWS.find(function(a) { return a.id === id; });
  var idx = bookmarks.findIndex(function(b) { return b.id === id; });
  if (idx === -1) {
    bookmarks.push(art);
    btn.classList.add('bookmarked');
    btn.textContent = '🔖';
    btn.title = 'Remove bookmark';
    btn.closest('.news-card').classList.add('bookmarked');
    toast('Article bookmarked!');
  } else {
    bookmarks.splice(idx, 1);
    btn.classList.remove('bookmarked');
    btn.textContent = '🏷️';
    btn.title = 'Bookmark';
    btn.closest('.news-card').classList.remove('bookmarked');
    toast('Bookmark removed');
  }
  localStorage.setItem('trakn-bookmarks', JSON.stringify(bookmarks));
  renderBookmarkPanel();
}

function renderBookmarkPanel() {
  $('bmCount').textContent = bookmarks.length;
  if (bookmarks.length === 0) {
    $('bookmarkList').innerHTML = '<div class="empty-bm">No saved articles yet.</div>';
    return;
  }
  $('bookmarkList').innerHTML = bookmarks.slice(0, 6).map(function(b) {
    return '<div class="bookmark-item" onclick="window.open(\'' + b.url + '\',\'_blank\')">' +
      '<div class="bm-icon">' + (b.emoji || '📰') + '</div>' +
      '<div class="bm-title">' + b.title + '</div>' +
    '</div>';
  }).join('');
}

// ─────────────────────────────────────────────
// TICKER
// ─────────────────────────────────────────────
function buildTicker() {
  var items = NEWS.map(function(a) {
    return '<span class="ticker-item">' + a.emoji + ' ' + a.title + '</span>';
  });
  $('tickerInner').innerHTML = items.concat(items).join('');
}

// ─────────────────────────────────────────────
// UTILITIES
// ─────────────────────────────────────────────
function toast(msg) {
  $('toastMsg').textContent = msg;
  $('toast').classList.add('show');
  setTimeout(function() { $('toast').classList.remove('show'); }, 2500);
}

function timeAgo(d) {
  var s = Math.floor((Date.now() - new Date(d)) / 1000);
  if (s < 60) return 'Just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

// ─────────────────────────────────────────────
// EVENT LISTENERS
// ─────────────────────────────────────────────
function setupEventListeners() {
  document.querySelectorAll('.cat-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentCat = btn.dataset.cat;
      renderAll();
    });
  });
  $('searchInput').addEventListener('input', function(e) {
    currentSearch = e.target.value;
    renderAll();
  });
}

init();
</script>
