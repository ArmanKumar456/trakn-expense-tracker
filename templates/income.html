    <style>
        .income-chart-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .income-chart-bar .bar-label {
            width: 90px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: right;
            flex-shrink: 0;
        }
        .income-chart-bar .bar-track {
            flex: 1;
            height: 10px;
            background: var(--bg-light);
            border-radius: 99px;
            overflow: hidden;
        }
        .income-chart-bar .bar-fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, #28a745, #52c234);
            transition: width 0.6s ease;
        }
        .income-chart-bar .bar-amount {
            width: 90px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--green-income, #28a745);
            flex-shrink: 0;
        }
        .tx-delete-btn {
            background: none;
            border: none;
            color: var(--text-gray);
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            opacity: 0.5;
            transition: opacity 0.15s, color 0.15s;
        }
        .tx-delete-btn:hover { opacity: 1; color: var(--red-expense, #dc3545); }
        .filter-row {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .filter-row select, .filter-row input {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-white);
            color: var(--text-primary);
            font-size: 0.85rem;
        }
    </style>

    <main class="main-content">

            </div>
            <div class="header-right">

        </header>

        <!-- Total Income Card -->
        <div class="balance-card" style="background:linear-gradient(135deg,#1a5a3a 0%,#28a745 100%);margin-bottom:1.5rem;">
            <div class="balance-label" style="color:rgba(255,255,255,0.8);">Total Income This Month</div>
            <div class="balance-amount" id="totalIncome">₹0.00</div>
            <div style="color:rgba(255,255,255,0.7);font-size:0.9rem;margin-top:0.5rem;" id="incomeCount">0 transactions</div>

                        <div class="form-group">

                    <div class="form-group">

                            <option value="freelance">Freelance</option>
                            <option value="business">Business</option>
                            <option value="investment">Investment</option>
                            <option value="rental">Rental Income</option>
                            <option value="bonus">Bonus</option>
                            <option value="gift">Gift</option>

                        <button type="button" class="btn btn-secondary" onclick="window.history.back()">Cancel</button>

<script src="/static/js/app.js"></script>
<script>
if (localStorage.getItem('trakn-is-admin') === 'true') {
    document.querySelector('.admin-link').style.display = 'flex';
}

document.getElementById('currentMonth').textContent =
    new Date().toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });

document.getElementById('date').value = FinFlow.Utils.todayStr();

const SOURCE_NAMES = {
    salary: 'Salary', freelance: 'Freelance', business: 'Business',
    investment: 'Investment', rental: 'Rental Income',
    bonus: 'Bonus', gift: 'Gift', other: 'Other'
};

let allIncome = [];

// ── FIXED: Safe date formatter — handles all date string formats ──
function formatDateSafe(dateStr) {
    if (!dateStr) return '—';
    const str = String(dateStr);
    // Extract YYYY-MM-DD from ISO, datetime, or plain string
    const iso = str.includes('T') ? str.split('T')[0] : str.split(' ')[0];
    const parts = iso.split('-').map(Number);
    if (parts.length === 3 && parts[0] > 1000) {
        const [y, m, d] = parts;
        const months = ['Jan','Feb','Mar','Apr','May','Jun',
                        'Jul','Aug','Sep','Oct','Nov','Dec'];
        return `${d} ${months[m - 1]} ${y}`;
    }
    // Fallback: let JS parse it
    const parsed = new Date(str);
    if (!isNaN(parsed)) {
        return parsed.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
    }
    return '—';
}

// ── Form Submit ────────────────────────────────────────────
document.getElementById('incomeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = {
        title:    formData.get('title').trim(),
        amount:   parseFloat(formData.get('amount')),
        date:     formData.get('date'),
        category: formData.get('category'),
        notes:    formData.get('notes') || '',
        type:     'income'
    };

    if (!data.title || !data.amount || !data.date || !data.category) {
        FinFlow.Toast.error('Please fill in all required fields');
        return;
    }

    const btn      = document.getElementById('submitBtn');
    const origHTML = btn.innerHTML;
    btn.disabled   = true;
    btn.textContent = 'Adding...';

    try {
        await FinFlow.Transactions.create(data);
        FinFlow.Toast.success('Income added successfully! ✅');
        e.target.reset();
        document.getElementById('date').value = FinFlow.Utils.todayStr();
        await loadIncomeData();
    } catch (error) {
        FinFlow.Toast.error(error.message || 'Failed to add income');
    } finally {
        btn.disabled  = false;
        btn.innerHTML = origHTML;
    }
});

// ── Delete income ──────────────────────────────────────────
async function deleteIncome(id) {
    if (!confirm('Delete this income entry?')) return;
    try {
        await FinFlow.Transactions.delete(id);
        FinFlow.Toast.success('Income deleted');
        await loadIncomeData();
    } catch(err) {
        FinFlow.Toast.error('Failed to delete');
    }
}

// ── Render list ────────────────────────────────────────────
function renderList(transactions) {
    const container = document.getElementById('recentIncome');
    const badgeEl   = document.getElementById('recentBadge');
    badgeEl.textContent = `Showing ${transactions.length} of ${allIncome.length}`;

    if (!transactions.length) {
        container.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--text-gray);"><p>No income found</p></div>';
        return;
    }

    container.innerHTML = '';
    transactions.forEach(t => {
        const item = document.createElement('div');
        item.className = 'transaction-item';
        item.style.cssText = 'display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-color);';
        item.innerHTML = `
            <div class="transaction-icon salary" style="background:rgba(40,167,69,0.1);color:var(--green-income,#28a745);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;flex-shrink:0;">
                ${(t.category || 'o').charAt(0).toUpperCase()}
            </div>
            <div class="transaction-details" style="flex:1;min-width:0;">
                <div class="transaction-title" style="font-weight:600;font-size:0.95rem;">${t.title}</div>
                <div class="transaction-meta" style="font-size:0.8rem;color:var(--text-secondary);margin-top:2px;">
                    ${formatDateSafe(t.date)} · ${SOURCE_NAMES[t.category] || t.category || 'Other'}
                    ${(t.notes && !t.notes.startsWith('Recurring')) ? `<span style="color:var(--text-gray);"> · ${t.notes}</span>` : ''}
                </div>
            </div>
            <div class="transaction-amount income" style="font-weight:700;color:var(--green-income,#28a745);flex-shrink:0;">
                +${FinFlow.Utils.formatCurrency(t.amount)}
            </div>
            <button class="tx-delete-btn" onclick="deleteIncome(${t.id})" title="Delete">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>`;
        container.appendChild(item);
    });
}

// ── Filter ─────────────────────────────────────────────────
document.getElementById('filterSource').addEventListener('change', function() {
    const val      = this.value;
    const filtered = val ? allIncome.filter(t => t.category === val) : allIncome;
    renderList(filtered);
});

// ── Load Income Data ───────────────────────────────────────
async function loadIncomeData() {
    try {
        const now   = new Date();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year  = String(now.getFullYear());

        const allTransactions = await FinFlow.Transactions.getAll({ type: 'income' });
        const monthTransactions = await FinFlow.Transactions.getAll({
            type:       'income',
            start_date: `${year}-${month}-01`,
            end_date:   `${year}-${month}-31`
        });

        allIncome = allTransactions || [];

        if (!allIncome.length) {
            document.getElementById('totalIncome').textContent = '₹0.00';
            document.getElementById('incomeCount').textContent = '0 transactions';
            document.getElementById('sourceList').innerHTML = '<div style="padding:2rem;text-align:center;color:var(--text-gray);"><p>No income yet. Add your first income above.</p></div>';
            renderList([]);
            return;
        }

        // Month total
        const monthTotal = (monthTransactions || []).reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
        document.getElementById('totalIncome').textContent = FinFlow.Utils.formatCurrency(monthTotal);
        document.getElementById('incomeCount').textContent =
            `${(monthTransactions || []).length} transaction${(monthTransactions || []).length !== 1 ? 's' : ''} this month`;

        // Source breakdown (all time)
        const sources = {};
        let grandTotal = 0;
        allIncome.forEach(t => {
            const cat = t.category || 'other';
            sources[cat] = (sources[cat] || 0) + (parseFloat(t.amount) || 0);
            grandTotal  += (parseFloat(t.amount) || 0);
        });

        const sourceList = document.getElementById('sourceList');
        sourceList.innerHTML = '';
        document.getElementById('sourceBadge').textContent = Object.keys(sources).length + ' sources';

        Object.entries(sources)
            .sort((a, b) => b[1] - a[1])
            .forEach(([cat, amount]) => {
                const pct  = grandTotal > 0 ? (amount / grandTotal * 100).toFixed(1) : 0;
                const item = document.createElement('div');
                item.className = 'income-chart-bar';
                item.innerHTML = `
                    <div class="bar-label">${SOURCE_NAMES[cat] || cat}</div>
                    <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
                    <div class="bar-amount">${FinFlow.Utils.formatCurrency(amount)}</div>`;
                sourceList.appendChild(item);
            });

        renderList(allIncome);

    } catch (error) {
        console.error('Error loading income:', error);
        FinFlow.Toast.error('Failed to load income data');
    }
}

loadIncomeData();
</script>
